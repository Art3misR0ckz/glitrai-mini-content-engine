services:
  - type: web
    name: glitrai-mini-content-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_APP_NAME
        value: GlitrAI Mini Content Engine
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "25"
      - key: OPENROUTER_MAX_RETRIES
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: ENVIRONMENT
        value: production
      - key: IMAGE_PROVIDER
        value: mock
